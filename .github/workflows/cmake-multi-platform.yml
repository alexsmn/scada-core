# CI workflow for scada-core
# Builds and tests on Windows (MSVC) and Linux (GCC, Clang)
#
# Note: core consumes one other product, `net`, which the standalone build
# expects as a sibling checkout (`../net`); see build-support/README.md. This
# workflow checks out core alone, so configure fails until that is wired up —
# which is why the build jobs are allowed to fail. The compiler is selected
# through CC/CXX rather than a per-compiler preset: every product carries the
# same self-contained preset set (ADR 0011), and `ninja` is the only configure
# preset there is.

name: CI

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    branches: [ "main", "release/**" ]

jobs:
  build:
    name: ${{ matrix.os }} - ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    # Allow build to fail until external dependencies are configured
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: windows-latest
            compiler: msvc

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # Linux dependencies - only install required Boost components
    # Required: atomic, context, date_time, filesystem, json, log, program_options, regex, system, thread
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libboost-atomic-dev \
          libboost-context-dev \
          libboost-date-time-dev \
          libboost-filesystem-dev \
          libboost-json-dev \
          libboost-log-dev \
          libboost-program-options-dev \
          libboost-regex-dev \
          libboost-system-dev \
          libboost-thread-dev \
          libprotobuf-dev \
          protobuf-compiler \
          ninja-build

    # Windows dependencies via vcpkg - only install required Boost components
    # Required: atomic, context, date_time, filesystem, json, log, program_options, regex, system, thread
    # Every product resolves its own vcpkg manifest, so the toolchain is needed
    # on every platform, not only Windows (ADR 0010, ADR 0011).
    - name: Setup vcpkg
      continue-on-error: true
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 'a34c873a9717a888f58dc05571dde15571f56e66'

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      continue-on-error: true
      run: |
        if (Get-Command vcpkg -ErrorAction SilentlyContinue) {
          vcpkg install boost-system boost-date-time boost-json boost-log boost-program-options boost-filesystem boost-thread boost-atomic boost-context boost-regex protobuf --triplet x64-windows
        } else {
          Write-Host "::warning::vcpkg not available, skipping dependency installation"
        }
      shell: pwsh

    # Cache CMake build
    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ matrix.os }}-${{ matrix.compiler }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', 'CMakePresets.json') }}
        restore-keys: |
          ${{ matrix.os }}-${{ matrix.compiler }}-

    - name: Configure CMake
      id: cmake-configure
      run: cmake --preset ninja
      env:
        VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
      continue-on-error: true

    - name: Build (Debug)
      if: steps.cmake-configure.outcome == 'success'
      run: cmake --build --preset debug --parallel

    - name: Build (Release)
      if: steps.cmake-configure.outcome == 'success'
      run: cmake --build --preset release --parallel

    - name: Test (Release)
      if: steps.cmake-configure.outcome == 'success'
      run: ctest --preset test-release --parallel

    - name: Report missing dependencies
      if: steps.cmake-configure.outcome == 'failure'
      run: |
        echo "::warning::CMake configuration failed. This is expected while the `net` product is not checked out beside this repository."
        echo "See CLAUDE.md and build-support/README.md for what a standalone core build needs."

    - name: Upload test results
      if: failure() && steps.cmake-configure.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.compiler }}
        path: |
          build/ninja/Testing/
          build/ninja/**/*test*.log
        retention-days: 7

  # Static analysis (Linux only) — the only job here that can actually gate.
  #
  # It runs the SAME cppcheck configuration the build runs, and reads the same
  # suppressions file: `scada_configure_cppcheck()` in
  # build-support/ScadaProductBase.cmake picks `<product>/cppcheck-suppressions.txt`,
  # so a finding suppressed for a local build is suppressed here too. Before
  # 2026-08-15 this job hand-rolled a different flag set and passed no
  # suppressions file at all, which made it rediscover 58 GoogleTest
  # false positives (`syntaxError`, already suppressed in that file) and fail on
  # every push since the repo was first published. It also analysed `model/`,
  # which moved to common/model/ long ago.
  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cppcheck

    - name: Run cppcheck
      run: |
        cppcheck --enable=warning,performance,portability \
          --suppressions-list=cppcheck-suppressions.txt \
          --inline-suppr \
          --std=c++20 \
          -I base -I scada -I metrics -I remote \
          --output-file=cppcheck-report.txt \
          base/ scada/ metrics/ remote/ \
          2>&1 || true

        cat cppcheck-report.txt

        # Errors gate; warnings are reported but do not fail the job. cppcheck's
        # own --error-exitcode cannot express that split — it fires on any
        # finding — so the severity is read back out of the report.
        if grep -q "error:" cppcheck-report.txt; then
          echo "::error::cppcheck found errors"
          exit 1
        fi

    - name: Upload cppcheck report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cppcheck-report
        path: cppcheck-report.txt
        retention-days: 7
