# CI workflow for scada-core.
#
# core consumes one other product, `net`, which a standalone build resolves as
# a SIBLING directory named after the product (build-support/ScadaProducts.cmake
# resolves `../net`). `net` publishes as `transport`, so its checkout names
# `path: net` explicitly -- the directory name is what matters, never the
# repository's. Everything else is core's own presets and its own vcpkg.json,
# resolved by the toolchain during configure (ADR 0011).
#
# Until 2026-09-27 this matrix checked core out alone, could never configure,
# and reported success anyway: every step that could fail was
# `continue-on-error`, so each job spent an hour installing dependencies and
# then built and tested nothing (superproject tasks.md 316). There is no
# `continue-on-error` anywhere in this file now, on purpose.

name: CI

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    branches: [ "main", "release/**" ]

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows / MSVC
            os: windows-latest
          - name: Ubuntu / GCC
            os: ubuntu-latest
          - name: macOS / AppleClang
            os: macos-latest

    env:
      # A plain directory carried between runs by the restore/save steps below.
      # Not `x-gha`: vcpkg has removed that backend.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"

    steps:
    - name: Check out scada-core
      uses: actions/checkout@v7
      with:
        path: core

    # Publishes as `transport`; the directory must be `net`.
    - name: Check out transport (the `net` product)
      uses: actions/checkout@v7
      with:
        repository: alexsmn/transport
        path: net

    - name: Install Ninja (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build

    # GCC 14, not the runner's default GCC 13: GCC 13.3 hits an internal
    # compiler error (`in build_special_member_call, at cp/call.cc:11096`) on
    # core/scada/monitored_item_service_awaitable.cpp:60, deterministically
    # (superproject docs/ops/deployment.md, "When the cross-build crashes the
    # compiler"). The ubuntu-24.04 image ships 12.4, 13.3 and 14.2 side by side
    # (actions/runner-images, images/ubuntu/Ubuntu2404-Readme.md, checked
    # 2026-09-26). Set before vcpkg runs, so its ports build with it too.
    - name: Select GCC 14 (Linux)
      if: runner.os == 'Linux'
      run: |
        echo "CC=gcc-14" >> "$GITHUB_ENV"
        echo "CXX=g++-14" >> "$GITHUB_ENV"

    - name: Install Ninja (macOS)
      if: runner.os == 'macOS'
      run: brew install ninja

    # The presets carry no `environment` block (ADR 0011), so the MSVC
    # toolchain has to be in the environment before cmake runs.
    - name: Set up MSVC (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    # The commit the monorepo's own vcpkg is at, the pin the client's, opcuapp's
    # and transport's workflows carry.
    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 'f3e10653cc27d62a37a3763cd84b38bca07c6075'
        runVcpkgInstall: false

    - name: Create the binary cache directory
      run: cmake -E make_directory "${{ github.workspace }}/vcpkg-cache"

    - name: Restore the vcpkg binary cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/vcpkg-cache
        key: vcpkg-${{ matrix.os }}-${{ hashFiles('core/vcpkg.json') }}-${{ github.run_id }}
        restore-keys: |
          vcpkg-${{ matrix.os }}-${{ hashFiles('core/vcpkg.json') }}-
          vcpkg-${{ matrix.os }}-

    - name: Configure
      working-directory: core
      run: cmake --preset ninja

    # `-k 0`: report every compile error in one run rather than the first.
    - name: Build (Release)
      working-directory: core
      run: cmake --build --preset release -- -k 0

    # Saved even when the build fails, so the ports that did build survive.
    - name: Save the vcpkg binary cache
      if: always()
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/vcpkg-cache
        key: vcpkg-${{ matrix.os }}-${{ hashFiles('core/vcpkg.json') }}-${{ github.run_id }}

    # Runs net's tests as well as core's: the consumed product is built into
    # this tree. `--timeout 300` turns a hang into one named failure.
    - name: Test (Release)
      working-directory: core
      run: ctest --preset test-release --output-on-failure --timeout 300

  # Static analysis (Linux only). It gates, as the build matrix above now does.
  #
  # It runs the SAME cppcheck configuration the build runs, and reads the same
  # suppressions file: `scada_configure_cppcheck()` in
  # build-support/ScadaProductBase.cmake picks `<product>/cppcheck-suppressions.txt`,
  # so a finding suppressed for a local build is suppressed here too. Before
  # 2026-08-15 this job hand-rolled a different flag set and passed no
  # suppressions file at all, which made it rediscover 58 GoogleTest
  # false positives (`syntaxError`, already suppressed in that file) and fail on
  # every push since the repo was first published. It also analysed `model/`,
  # which moved to common/model/ long ago.
  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cppcheck

    - name: Run cppcheck
      run: |
        cppcheck --enable=warning,performance,portability \
          --suppressions-list=cppcheck-suppressions.txt \
          --inline-suppr \
          --std=c++20 \
          -I base -I scada -I metrics -I remote \
          --output-file=cppcheck-report.txt \
          base/ scada/ metrics/ remote/ \
          2>&1 || true

        cat cppcheck-report.txt

        # Errors gate; warnings are reported but do not fail the job. cppcheck's
        # own --error-exitcode cannot express that split — it fires on any
        # finding — so the severity is read back out of the report.
        if grep -q "error:" cppcheck-report.txt; then
          echo "::error::cppcheck found errors"
          exit 1
        fi

    - name: Upload cppcheck report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: cppcheck-report
        path: cppcheck-report.txt
        retention-days: 7
